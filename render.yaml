# Render blueprint for TuitionTrack:
# 1. tuitiontrack-db:  PostgreSQL Database (Managed by Render)
# 2. tuitiontrack-api: Django REST API backend (Python Web Service)
# 3. tuitiontrack-web: React + Vite Single Page Application (Static Site)
#
# In Render Dashboard: New + → Blueprint → select this repository.

databases:
  # ── PostgreSQL Database (Render Managed) ──
  - name: tuitiontrack-db
    databaseName: tuitiontrack
    user: tuitiontrack
    plan: free            # Free for 30 days. To keep it permanently, change plan to "starter" ($7/month)
    region: singapore     # Must match the web service region for internal private networking

services:
  # ── Backend Web Service (Django REST Framework) ──
  - type: web
    name: tuitiontrack-api
    runtime: python
    plan: free            # Sleeps after ~15 mins idle; "starter" stays awake
    region: singapore     # Same region as tuitiontrack-db
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/v1/meta/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DISPLAY_TIME_ZONE
        value: Asia/Dhaka
      - key: REFRESH_TOKEN_LIFETIME_DAYS
        value: "30"

      # ── Database Connection (Render Managed PostgreSQL) ──
      # Automatically connects to tuitiontrack-db over Render's low-latency internal network.
      # Render's free database expires after 30 days. After moving to Neon
      # (RENDER_DEPLOYMENT_GUIDE.md → "Moving the database to Neon"), replace these four
      # lines with the commented ones below and set the values in the Dashboard:
      - key: DATABASE_URL
        fromDatabase:
          name: tuitiontrack-db
          property: connectionString
      # - key: DATABASE_URL        # the Neon pooled connection string
      #   sync: false
      # - key: DB_CONN_MAX_AGE     # let Neon sleep when nobody is using the app
      #   value: "0"
      # Optional: SENTRY_DSN (error reports), set in the Dashboard.

      # ── Frontend & CORS ──
      # FRONTEND_URL is the one web origin allowed to call the API from a browser (CORS) and the
      # address used in password-reset emails. Other origins: CORS_ALLOWED_ORIGINS (comma-separated).
      # Other *.onrender.com sites are NOT trusted automatically.
      - key: FRONTEND_URL
        value: https://tuitiontrack-web.onrender.com

      # ── App updates: the newest APK version and where to download it ──
      # Bump APP_LATEST_VERSION after you publish a new TuitionTrack.apk; the app
      # then offers the download to everyone on an older version.
      - key: APP_LATEST_VERSION
        value: "1.1.0"
      - key: APP_DOWNLOAD_URL
        value: https://github.com/ashraf1600/TuitionTrack/releases/latest/download/TuitionTrack.apk

      # ── Email (password-reset codes) ──
      # Render's free plan blocks SMTP, so mail goes out over HTTPS through Brevo.
      # Set BREVO_API_KEY and DEFAULT_FROM_EMAIL (a sender verified in Brevo) in the Dashboard.
      # Until BREVO_API_KEY is set, reset e-mails are not delivered (the error is in the logs).
      - key: EMAIL_BACKEND
        value: config.email_backends.BrevoEmailBackend
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL     # e.g. TuitionTrack <yourname@gmail.com>
        sync: false

      # ── Sign in with Google ──
      # The "Web application" OAuth client ID. Website and app read it from /api/v1/meta/,
      # so this is the only place it needs to be set. Empty: no Google button.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # ── Optional: Auto-create Django admin superuser on first deploy ──
      # - key: DJANGO_SUPERUSER_USERNAME
      #   value: admin
      # - key: DJANGO_SUPERUSER_EMAIL
      #   value: admin@example.com
      # - key: DJANGO_SUPERUSER_PASSWORD
      #   sync: false

      # ── Supabase Storage (S3-compatible) for permanent file uploads ──
      # Render's own disk is wiped on every deploy, so uploads live here instead.
      # Fill the 6 values below in Dashboard → tuitiontrack-api → Environment
      # (see project README "Media storage" for where each comes from in Supabase).
      - key: S3_BUCKET
        value: tuitiontrack-media
      - key: S3_REGION
        value: ap-southeast-1
      - key: S3_ENDPOINT_URL        # https://<ref>.storage.supabase.co/storage/v1/s3
        sync: false
      - key: S3_PUBLIC_DOMAIN       # <ref>.supabase.co/storage/v1/object/public/tuitiontrack-media
        sync: false
      - key: S3_ACCESS_KEY_ID       # Supabase → Storage → Settings → S3 access keys
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # ── Frontend Web App (React + Vite Single Page Application) ──
  - type: web
    name: tuitiontrack-web
    runtime: static
    rootDir: frontend
    # The lockfile carries the native build tools for every platform, so a clean install is reproducible.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # Rewrites all requests to /index.html so React Router client-side routes work on reload
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      # Point to your deployed backend API URL, e.g. https://tuitiontrack-api.onrender.com
      - key: VITE_API_URL
        value: https://tuitiontrack-api.onrender.com
