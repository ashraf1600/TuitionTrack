name: Build & release APK

on:
  push:
    tags:
      - 'v*'
  # Build again for a release that already exists (Actions → Build & release APK → Run workflow).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the APK to, e.g. v1.4.0'
        required: true

# Attaching the APK to the release needs write access to the repository's releases.
permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # pubspec.yaml needs Dart >= 3.13.5 (Flutter >= 3.44); the old 3.27.4 pin could not resolve packages.
          channel: stable

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mobile/.dart_tool/
          key: ${{ runner.os }}-flutter-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Use the release signing key
        # One fixed key is required for Sign in with Google: Google only accepts the app
        # when the SHA-1 of the key that signed it is registered (Google Cloud Console →
        # Credentials → Android OAuth client). Add these repository secrets once:
        #   ANDROID_KEYSTORE_BASE64  base64 of your .jks file
        #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
        # See RENDER_DEPLOYMENT_GUIDE.md → "Sign in with Google". Without them the APK is
        # signed with this runner's throwaway debug key and Google sign-in will not work.
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway debug key. Google sign-in will not work in this APK."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          echo "SHA-1 to register with Google (Android OAuth client):"
          keytool -list -v -keystore app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "SHA1|SHA-1"

      - name: Build release APK
        working-directory: mobile
        # The app's default server; set the repository variable API_BASE_URL to change it.
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://tuitiontrack-api.onrender.com' }}

      - name: Name the APK the way the in-app update link expects
        # The app offers .../releases/latest/download/TuitionTrack.apk (APP_DOWNLOAD_URL).
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk TuitionTrack.apk

      - name: Compute SHA-256
        run: |
          sha256sum TuitionTrack.apk | tee TuitionTrack.apk.sha256

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            TuitionTrack.apk
            TuitionTrack.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: false