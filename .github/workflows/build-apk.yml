name: Build & release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # pubspec.yaml needs Dart >= 3.13.5 (Flutter >= 3.44); the old 3.27.4 pin could not resolve packages.
          channel: stable

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mobile/.dart_tool/
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        # The app's default server; set the repository variable API_BASE_URL to change it.
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://tuitiontrack-api.onrender.com' }}

      - name: Sign APK (placeholder — replace with your keystore)
        # NOTE: This step signs with the debug key so the workflow runs without
        # secrets. For a real release, add signing.properties, KEYSTORE_FILE,
        # KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD as repo secrets and
        # replace this step with a release signing block.
        run: |
          echo "Built unsigned-by-key keystore APK. See README to add a release keystore."
          ls -la mobile/build/app/outputs/flutter-apk/

      - name: Compute SHA-256
        run: |
          sha256sum mobile/build/app/outputs/flutter-apk/app-release.apk | tee app-release.apk.sha256

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            app-release.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: false