name: Keep the API awake

# Render's free plan puts the API to sleep after 15 quiet minutes, and waking it
# takes about a minute. This asks it a cheap question every 10 minutes during
# tutoring hours in Bangladesh (2 PM to midnight), so it is awake when people use it.
# About 300 of the workspace's 750 free instance hours a month. To stop: delete this file.
on:
  schedule:
    - cron: '*/10 8-17 * * *'   # UTC = 14:00-23:59 Asia/Dhaka
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the API for its version
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null https://tuitiontrack-api.onrender.com/api/v1/meta/
