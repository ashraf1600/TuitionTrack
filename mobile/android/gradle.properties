# Sized for an 8 GB PC. The template default (8 GB heap) exhausts memory and grows the Windows page file.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
# Compile Kotlin inside the Gradle process instead of a second ~1 GB Kotlin daemon.
kotlin.compiler.execution.strategy=in-process
# One task at a time: slower, but peak memory stays low enough for an 8 GB PC.
org.gradle.workers.max=1
# A finished or failed build's daemon frees its memory after 10 minutes (default: 3 hours).
org.gradle.daemon.idletimeout=600000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The plugins' Kotlin sources live in the pub cache on C: while the project is on D:.
# Kotlin's incremental caches break across drives on Windows ("Could not close
# incremental caches"), so compile those plugins in full each time.
kotlin.incremental=false
