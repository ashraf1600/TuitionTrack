# Sized for an 8 GB PC. The template default (8 GB heap) exhausts memory and grows the Windows page file.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The plugins' Kotlin sources live in the pub cache on C: while the project is on D:.
# Kotlin's incremental caches break across drives on Windows ("Could not close
# incremental caches"), so compile those plugins in full each time.
kotlin.incremental=false
